<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karate-kuntotesti – Budo Akatemia ry</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: #f4f1ec;
  color: #1a1a1a;
  font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1rem 4rem;
}

.card {
  width: 100%;
  max-width: 600px;
  background: #ffffff;
  border: 1px solid #d8d0c4;
  border-radius: 12px;
  padding: 2rem 2rem 2.4rem;
  box-shadow: 0 4px 24px rgba(0,0,0,.10);
}

.eyebrow {
  font-size: .7rem; letter-spacing: .28em; color: #888;
  text-transform: uppercase; text-align: center;
  margin-bottom: .3rem; font-weight: 500;
}
h1 {
  font-size: clamp(1.5rem, 5vw, 2.1rem); font-weight: 700;
  text-align: center; color: #1a1a1a;
  margin-bottom: .2rem; letter-spacing: -.01em;
}
.sub {
  font-size: .68rem; color: #999; text-align: center;
  letter-spacing: .14em; margin-bottom: 1.6rem; font-weight: 500;
}
.rule {
  width: 48px; height: 2px; background: #c8943a;
  margin: 0 auto 1.8rem; border-radius: 2px;
}

.lbl {
  font-size: .72rem; font-weight: 700; letter-spacing: .1em;
  color: #555; text-transform: uppercase;
  margin-bottom: .5rem; display: block;
}

.seg {
  display: flex; background: #f0ece6; border: 1px solid #d4ccc2;
  border-radius: 8px; overflow: hidden;
  margin-bottom: 1.2rem; padding: 3px; gap: 3px;
}
.seg button {
  flex: 1; padding: .5rem .6rem; border: none; cursor: pointer;
  font-family: inherit; font-size: .9rem; font-weight: 500;
  background: transparent; color: #777; border-radius: 6px;
  transition: all .15s;
}
.seg button.active {
  background: #ffffff; color: #1a1a1a; font-weight: 700;
  box-shadow: 0 1px 4px rgba(0,0,0,.12);
}

.btn-primary {
  width: 100%; padding: .85rem; background: #c8943a; color: #fff;
  border: none; border-radius: 8px; font-size: 1rem;
  font-family: inherit; font-weight: 700; cursor: pointer;
  letter-spacing: .02em; margin-top: .6rem;
  transition: background .15s, opacity .15s;
}
.btn-primary:hover { background: #b07e2e; }
.btn-primary:disabled { opacity: .35; cursor: default; background: #c8943a; }
.btn-ghost {
  background: transparent; color: #777; border: 1px solid #d0c8be;
  border-radius: 7px; padding: .5rem .9rem;
  font-family: inherit; font-size: .82rem; font-weight: 500;
  cursor: pointer; width: 100%; margin-bottom: .7rem;
  transition: color .15s, border-color .15s;
}
.btn-ghost:hover { color: #333; border-color: #aaa; }

.number-input {
  width: 100%; background: #f8f6f2; border: 2px solid #d0c8be;
  border-radius: 8px; padding: .8rem 1rem;
  font-size: 2rem; font-weight: 700; color: #1a1a1a;
  font-family: inherit; text-align: center; outline: none;
  margin-bottom: .6rem; transition: border-color .2s;
}
.number-input:focus { border-color: #c8943a; background: #fff; }

/* Level selector (5-stage body landmark) */
.level-selector {
  display: flex; flex-direction: column; gap: .35rem;
  margin-bottom: .6rem;
}
.level-btn {
  background: #f8f6f2; border: 2px solid #d0c8be;
  border-radius: 8px; padding: .65rem .9rem;
  font-family: inherit; font-size: .9rem; font-weight: 600;
  color: #1a1a1a; cursor: pointer; text-align: left;
  display: flex; align-items: center; justify-content: space-between;
  transition: all .15s;
}
.level-btn:hover { border-color: #c8943a; background: #fff; }
.level-btn.active {
  background: #fff7e6; border-color: #c8943a; color: #1a1a1a;
}
.level-btn .level-num {
  display: inline-block; width: 24px; height: 24px;
  border-radius: 50%; background: #e0d8ce; color: #555;
  font-size: .8rem; line-height: 24px; text-align: center;
  margin-right: .6rem; font-weight: 700;
}
.level-btn.active .level-num {
  background: #c8943a; color: #fff;
}

.info-box {
  background: #f8f6f2; border: 1px solid #e0d8ce;
  border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: 1rem;
  font-size: .88rem; color: #3a3a3a; line-height: 1.75;
}
.intro-info {
  background: #fdf7ee; border: 1px solid #e8d8b4;
  border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: 1.4rem;
  font-size: .85rem; color: #4a3a1a; line-height: 1.7;
}
.intro-info strong {
  color: #9a6c1a; display: block; margin-bottom: .3rem; font-size: .9rem;
}

.progress-bar-wrap { margin-bottom: 1.4rem; }
.progress-meta {
  display: flex; justify-content: space-between;
  font-size: .75rem; font-weight: 600; color: #666; margin-bottom: .45rem;
}
.progress-track {
  height: 6px; background: #e8e0d4; border-radius: 6px; overflow: hidden;
}
.progress-fill { height: 100%; border-radius: 6px; transition: width .35s ease; }

.test-header { text-align: center; margin-bottom: 1.2rem; }
.test-icon { font-size: 2.2rem; margin-bottom: .3rem; }
.test-name { font-size: 1.4rem; font-weight: 700; color: #1a1a1a; margin-bottom: .2rem; }
.test-subtitle {
  font-size: .72rem; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase;
}

.level-badge {
  border-radius: 8px; padding: .6rem 1rem; margin-bottom: .7rem;
  text-align: center; font-weight: 700; font-size: 1rem;
}

.threshold-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: .4rem .8rem; border-radius: 6px; margin-bottom: .25rem;
}
.threshold-lbl { font-size: .8rem; font-weight: 600; }
.threshold-val { font-size: .8rem; font-family: 'Courier New', monospace; font-weight: 600; color: #333; }

.overall-box {
  text-align: center; padding: 1.2rem;
  border-radius: 10px; margin-bottom: 1.4rem;
}
.overall-eyebrow {
  font-size: .68rem; font-weight: 700; letter-spacing: .22em;
  color: #666; text-transform: uppercase; margin-bottom: .3rem;
}
.overall-label { font-size: 2rem; font-weight: 700; letter-spacing: -.01em; }
.cat-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: .65rem; margin-bottom: 1.4rem;
}
.cat-pill {
  border-radius: 8px; padding: .75rem 1rem;
  display: flex; align-items: center; gap: .65rem;
}
.cat-pill-icon { font-size: 1.4rem; }
.cat-pill-name {
  font-size: .62rem; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: #555; margin-bottom: .1rem;
}
.cat-pill-label { font-size: .88rem; font-weight: 700; }
.results-header {
  font-size: .7rem; font-weight: 700; letter-spacing: .14em;
  color: #888; text-transform: uppercase; margin-bottom: .65rem;
}
.result-row {
  display: flex; align-items: center; gap: .8rem;
  padding: .7rem .9rem; border-radius: 8px;
  background: #f8f6f2; border: 1px solid #e8e0d4; margin-bottom: .4rem;
}
.result-icon { font-size: 1.2rem; flex-shrink: 0; }
.result-name { font-size: .86rem; font-weight: 600; color: #1a1a1a; }
.result-cat { font-size: .62rem; font-weight: 600; letter-spacing: .06em; }
.result-value { font-size: 1rem; color: #1a1a1a; font-weight: 700; text-align: right; flex-shrink: 0; }
.result-unit { font-size: .65rem; color: #888; margin-left: .2rem; font-weight: 400; }
.result-level { font-size: .75rem; font-weight: 700; text-align: right; }
.dot-col { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: #ddd; }

.tips-box {
  background: #f8f6f2; border: 1px solid #e0d8ce;
  border-radius: 8px; padding: 1.1rem; margin-bottom: 1.2rem;
}
.tips-header {
  font-size: .7rem; font-weight: 700; letter-spacing: .14em;
  color: #888; text-transform: uppercase; margin-bottom: .75rem;
}
.tip-row {
  display: flex; gap: .65rem; margin-bottom: .6rem;
  font-size: .84rem; color: #3a3a3a; line-height: 1.6;
}

.intro-test-cat { margin-bottom: .9rem; }
.intro-cat-label {
  display: flex; align-items: center; gap: .5rem;
  font-size: .68rem; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; margin-bottom: .38rem;
}
.intro-test-item {
  display: flex; align-items: center; gap: .7rem;
  padding: .4rem .8rem; background: #f8f6f2;
  border-radius: 6px; margin-bottom: .22rem;
  border-left: 3px solid #e0d8ce;
}
.intro-test-item-name { font-size: .85rem; font-weight: 600; color: #1a1a1a; }
.intro-test-item-sub { font-size: .65rem; color: #888; }
#app { width: 100%; display: flex; flex-direction: column; align-items: center; }
</style>
</head>

    "Kehitä: 10 min päivittäin lonkan ja takareiden venytyksiä, pidot 30 sek.",
    "Aloita rauhallisesti — staattiset venytykset lämpimälle lihakselle, ei kylmänä.",
    "Liikkuvuus paranee parhaiten harjoituksen jälkeen — venyttele tunnin lopussa.",
  ],
};

// ─── STATE ────────────────────────────────────────────────────────────────────
let state = {
  phase: "intro",
  gender: "m",
  ageGroup: "nuori",
  currentIdx: 0,
  results: {},
  useAlt: false,
  showRef: false,
  selectedLevel: null,
};

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function calcScore(test, rawVal, gender, age, useAlt) {
  const t = useAlt ? (test.altScores?.[gender]?.[age]) : test.scores[gender][age];
  if (!t) return 4;
  const val = parseFloat(rawVal);
  if (isNaN(val)) return null;
  if (!test.allowNegative && val < 0) return null;
  if (val >= t[0]) return 0;
  if (val >= t[1]) return 1;
  if (val >= t[2]) return 2;
  if (val >= t[3]) return 3;
  return 4;
}

function thresholdRows(test, gender, age, useAlt) {
  const t = useAlt ? (test.altScores?.[gender]?.[age]) : test.scores[gender][age];
  if (!t) return [];
  const formatVal = (v, prefix) => {
    if (test.inputType === "level") {
      const lev = BODY_LEVELS.find(l => l.v === v);
      return prefix + (lev ? lev.short : v);
    }
    const unit = test.inputOptions ? test.inputOptions[useAlt ? 1 : 0] : test.unit;
    return `${prefix}${v} ${unit}`;
  };
  return [
    { label:"Erinomainen", val: formatVal(t[0], "≥ ") },
    { label:"Hyvä",        val: formatVal(t[1], "≥ ") },
    { label:"Tyydyttävä",  val: formatVal(t[2], "≥ ") },
    { label:"Välttävä",    val: formatVal(t[3], "≥ ") },
    { label:"Kehitettävä", val: formatVal(t[3], "< ") },
  ];
}

function catSummary() {
  return CATEGORIES.map(cat => {
    const vals = TESTS
      .filter(t => t.category === cat.id)
      .map(t => state.results[t.id]?.scoreIdx)
      .filter(v => v != null);
    const avg = vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : null;
    return { ...cat, avg };
  });
}

function overallIdx() {
  const vals = Object.values(state.results).map(r => r.scoreIdx).filter(v => v != null);
  return vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : 2;
}

function segBtn(val, label, active, group) {
  return `<button class="${active?'active':''}" data-group="${group}" data-val="${val}">${label}</button>`;
}

function displayValue(test, val, useAlt) {
  if (test.inputType === "level") {
    const lev = BODY_LEVELS.find(l => l.v === parseInt(val));
    return lev ? lev.short : val;
  }
  return val;
}

function displayUnit(test, useAlt) {
  if (test.inputType === "level") return "";
  return test.inputOptions ? test.inputOptions[useAlt ? 1 : 0] : test.unit;
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  if (state.phase === "intro")  app.innerHTML = renderIntro();
  if (state.phase === "test")   app.innerHTML = renderTest();
  if (state.phase === "result") app.innerHTML = renderResult();
  bindEvents();
}

// ── INTRO ─────────────────────────────────────────────────────────────────────
function renderIntro() {
  const testList = CATEGORIES.map(cat => {
    const cc = CAT_COLORS[cat.id];
    const items = TESTS.filter(t => t.category === cat.id).map(t =>
      `<div class="intro-test-item" style="border-left-color:${cc.border}">
        <span style="font-size:1.1rem">${t.icon}</span>
        <div>
          <div class="intro-test-item-name">${t.name}</div>
          <div class="intro-test-item-sub">${t.subtitle}</div>
        </div>
      </div>`
    ).join("");
    return `<div class="intro-test-cat">
      <div class="intro-cat-label" style="color:${cc.text}">${cat.icon} ${cat.label}</div>
      ${items}
    </div>`;
  }).join("");

  return `<div class="card">
    <div class="eyebrow">Budo Akatemia ry · Shorin-ryu Seibukan</div>
    <h1>Karate-kuntotesti</h1>
    <div class="sub">VOIMA · KESKIVARTALO · JALKAVOIMA · RÄJÄHTÄVYYS · TASAPAINO · LIIKKUVUUS</div>
    <div class="rule"></div>
    <span class="lbl">Sukupuoli</span>
    <div class="seg">
      ${segBtn("m","Miehet",state.gender==="m","gender")}
      ${segBtn("n","Naiset",state.gender==="n","gender")}
    </div>
    <span class="lbl">Ikäryhmä</span>
    <div class="seg">
      ${segBtn("nuori","16–29 v",state.ageGroup==="nuori","age")}
      ${segBtn("keski","30–44 v",state.ageGroup==="keski","age")}
      ${segBtn("masters","45–65 v",state.ageGroup==="masters","age")}
    </div>
    <div style="margin-bottom:1.4rem">${testList}</div>
    <div class="intro-info">
      <strong>10 testiä &nbsp;·&nbsp; n. 35–45 min</strong>
      Tarvitset: sekuntikello ja mittanauha. Tukikohta seinästä liikkuvuustesteille.<br>
      Tee 10 min alkulämmittely. Suorita testit järjestyksessä. Syötä tulos heti suorituksen jälkeen.
    </div>
    <button class="btn-primary" id="startBtn">Aloita testi →</button>
  </div>`;
}

// ── TEST ──────────────────────────────────────────────────────────────────────
function renderTest() {
  const test  = TESTS[state.currentIdx];
  const cat   = CATEGORIES.find(c => c.id === test.category);
  const cc    = CAT_COLORS[test.category];
  const total = TESTS.length;
  const pct   = ((state.currentIdx + 1) / total * 100).toFixed(1);
  const hasAlt = !!(test.inputOptions && test.altScores);
  const isLevel = test.inputType === "level";
  const unitLabel = isLevel ? "kehontaso" : (hasAlt ? test.inputOptions[state.useAlt ? 1 : 0] : test.unit);

  const altToggle = hasAlt ? `
    <div class="seg" style="margin-bottom:.9rem">
      <button class="${!state.useAlt?'active':''}" data-group="alt" data-val="0">${test.inputOptions[0]}</button>
      <button class="${state.useAlt?'active':''}" data-group="alt" data-val="1">${test.inputOptions[1]}</button>
    </div>` : "";

  let inputHtml = "";
  if (isLevel) {
    inputHtml = `<div class="level-selector">
      ${[...BODY_LEVELS].reverse().map(lev => `
        <button class="level-btn ${state.selectedLevel===lev.v?'active':''}" data-level="${lev.v}">
          <span><span class="level-num">${lev.v}</span>${lev.label}</span>
        </button>
      `).join("")}
    </div>`;
  } else {
    inputHtml = `<input id="testInput" class="number-input" type="number" inputmode="decimal" ${test.allowNegative ? "" : 'min="0"'} placeholder="0" value="">`;
  }

  const refRows = state.showRef
    ? thresholdRows(test, state.gender, state.ageGroup, state.useAlt).map((r,i) =>
        `<div class="threshold-row" style="background:${LEVEL_BG[i]};border:1px solid ${LEVEL_BORDER[i]}">
          <span class="threshold-lbl" style="color:${LEVEL_COLORS[i]}">${r.label}</span>
          <span class="threshold-val">${r.val}</span>
        </div>`
      ).join("")
    : "";

  return `<div class="card">
    <div class="progress-bar-wrap">
      <div class="progress-meta">
        <span>Testi ${state.currentIdx+1} / ${total}</span>
        <span style="color:${cc.text}">${cat.icon} ${cat.label}</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width:${pct}%;background:${cc.text}"></div>
      </div>
    </div>
    <div class="test-header">
      <div class="test-icon">${test.icon}</div>
      <div class="test-name">${test.name}</div>
      <div class="test-subtitle" style="color:${cc.text}">${test.subtitle}</div>
    </div>
    <div class="info-box">${test.desc}</div>
    ${altToggle}
    <span class="lbl">Tulos — ${unitLabel}</span>
    ${inputHtml}
    <div id="liveBadge" style="height:2.8rem;margin-bottom:.7rem"></div>
    <button class="btn-ghost" id="refToggle">${state.showRef ? "▴ Piilota" : "▾ Näytä"} viitearvot</button>
    <div id="refRows" style="margin-bottom:.3rem">${refRows}</div>
    <button class="btn-primary" id="nextBtn" disabled>
      ${state.currentIdx + 1 < total ? "Seuraava →" : "Näytä tulokset →"}
    </button>
  </div>`;
}

// ── RESULT ────────────────────────────────────────────────────────────────────
function renderResult() {
  const oi = overallIdx();
  const cs = catSummary();
  const gLabel = state.gender === "m" ? "Miehet" : "Naiset";
  const aLabel = {nuori:"16–29 v", keski:"30–44 v", masters:"45–65 v"}[state.ageGroup];

  const catPills = cs.map(cat => {
    const i  = cat.avg ?? 2;
    const cc = CAT_COLORS[cat.id];
    return `<div class="cat-pill" style="background:${cc.bg};border:1px solid ${cc.border}">
      <span class="cat-pill-icon">${cat.icon}</span>
      <div>
        <div class="cat-pill-name" style="color:${cc.text}">${cat.label}</div>
        <div class="cat-pill-label" style="color:${LEVEL_COLORS[i]}">${cat.avg !== null ? LEVEL_LABELS[i] : "—"}</div>
      </div>
    </div>`;
  }).join("");

  const resultRows = TESTS.map(t => {
    const res = state.results[t.id];
    if (!res) return "";
    const si  = res.scoreIdx;
    const cc  = CAT_COLORS[t.category];
    const cat = CATEGORIES.find(c => c.id === t.category);
    const valStr = displayValue(t, res.value, res.useAlt);
    const unitStr = displayUnit(t, res.useAlt);
    const dots = [0,1,2,3,4].map(j =>
      `<div class="dot" style="background:${j===si ? LEVEL_COLORS[si] : '#ddd'}"></div>`
    ).join("");
    return `<div class="result-row">
      <span class="result-icon">${t.icon}</span>
      <div style="flex:1;min-width:0">
        <div class="result-name">${t.name}</div>
        <div class="result-cat" style="color:${cc.text}">${cat.label}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div class="result-value">${valStr}${unitStr ? `<span class="result-unit">${unitStr}</span>` : ""}</div>
        <div class="result-level" style="color:${LEVEL_COLORS[si]}">${LEVEL_LABELS[si]}</div>
      </div>
      <div class="dot-col">${dots}</div>
    </div>`;
  }).join("");

  const tips = cs.map(cat => {
    const i = cat.avg ?? 2;
    return `<div class="tip-row">
      <span style="font-size:1.1rem;flex-shrink:0">${cat.icon}</span>
      <span>${DEV_TIPS[cat.id][Math.min(i,4)]}</span>
    </div>`;
  }).join("");

  return `<div class="card" style="max-width:640px">
    <div class="eyebrow">Budo Akatemia ry · Shorin-ryu Seibukan</div>
    <h1>Kuntotestin tulokset</h1>
    <div style="text-align:center;margin-bottom:.5rem;font-size:.78rem;color:#888;font-weight:600">
      ${gLabel} · ${aLabel}
    </div>
    <div class="rule"></div>
    <div class="overall-box" style="background:${LEVEL_BG[oi]};border:2px solid ${LEVEL_BORDER[oi]}">
      <div class="overall-eyebrow">Kokonaisarvio</div>
      <div class="overall-label" style="color:${LEVEL_COLORS[oi]}">${LEVEL_LABELS[oi]}</div>
    </div>
    <div class="cat-grid">${catPills}</div>
    <div class="results-header">Testikohtaiset tulokset</div>
    ${resultRows}
    <div style="margin-bottom:1.4rem"></div>
    <div class="tips-box">
      <div class="tips-header">Kehitysehdotukset</div>
      ${tips}
    </div>
    <button class="btn-primary" id="restartBtn">↺ Tee testi uudelleen</button>
  </div>`;
}

// ─── EVENTS ───────────────────────────────────────────────────────────────────
function bindEvents() {
  document.querySelectorAll(".seg button[data-group]").forEach(b => {
    b.addEventListener("click", () => {
      const g = b.dataset.group, v = b.dataset.val;
      if (g === "gender") state.gender = v;
      if (g === "age")    state.ageGroup = v;
      if (g === "alt")    state.useAlt = !!parseInt(v);
      render();
      if (state.phase === "test") document.getElementById("testInput")?.focus();
    });
  });

  document.getElementById("startBtn")?.addEventListener("click", () => {
    state.phase = "test"; state.currentIdx = 0; state.results = {};
    state.useAlt = false; state.showRef = false; state.selectedLevel = null;
    render();
    document.getElementById("testInput")?.focus();
  });

  document.getElementById("restartBtn")?.addEventListener("click", () => {
    state.phase = "intro"; state.results = {};
    render();
  });

  document.getElementById("refToggle")?.addEventListener("click", () => {
    state.showRef = !state.showRef;
    const test = TESTS[state.currentIdx];
    const btn = document.getElementById("refToggle");
    const div = document.getElementById("refRows");
    if (btn) btn.textContent = (state.showRef ? "▴ Piilota" : "▾ Näytä") + " viitearvot";
    if (div) div.innerHTML = state.showRef
      ? thresholdRows(test, state.gender, state.ageGroup, state.useAlt).map((r,i) =>
          `<div class="threshold-row" style="background:${LEVEL_BG[i]};border:1px solid ${LEVEL_BORDER[i]}">
            <span class="threshold-lbl" style="color:${LEVEL_COLORS[i]}">${r.label}</span>
            <span class="threshold-val">${r.val}</span>
          </div>`
        ).join("")
      : "";
  });

  // Level buttons
  document.querySelectorAll(".level-btn[data-level]").forEach(b => {
    b.addEventListener("click", () => {
      const lv = parseInt(b.dataset.level);
      state.selectedLevel = lv;
      // Update active states
      document.querySelectorAll(".level-btn").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      // Update live badge
      const test = TESTS[state.currentIdx];
      const pi = calcScore(test, lv, state.gender, state.ageGroup, false);
      const badge = document.getElementById("liveBadge");
      if (badge && pi !== null) {
        badge.innerHTML = `<div class="level-badge" style="background:${LEVEL_BG[pi]};border:2px solid ${LEVEL_BORDER[pi]};color:${LEVEL_COLORS[pi]}">${LEVEL_LABELS[pi]}</div>`;
      }
      const nb = document.getElementById("nextBtn");
      if (nb) nb.disabled = false;
    });
  });

  // Number input
  const inp = document.getElementById("testInput");
  if (inp) {
    inp.addEventListener("input", () => {
      const test = TESTS[state.currentIdx];
      const val  = parseFloat(inp.value);
      const valid = !isNaN(val) && (test.allowNegative || val >= 0);
      const pi   = valid ? calcScore(test, val, state.gender, state.ageGroup, state.useAlt) : null;
      inp.style.borderColor = pi !== null ? LEVEL_COLORS[pi] : "#d0c8be";
      const badge = document.getElementById("liveBadge");
      if (badge) {
        if (pi !== null) {
          badge.innerHTML = `<div class="level-badge" style="background:${LEVEL_BG[pi]};border:2px solid ${LEVEL_BORDER[pi]};color:${LEVEL_COLORS[pi]}">${LEVEL_LABELS[pi]}</div>`;
        } else {
          badge.innerHTML = "";
        }
      }
      const nb = document.getElementById("nextBtn");
      if (nb) nb.disabled = inp.value === "" || isNaN(val) || (!test.allowNegative && val < 0);
    });
    inp.addEventListener("keydown", e => { if (e.key === "Enter") submitTest(); });
  }

  document.getElementById("nextBtn")?.addEventListener("click", submitTest);
}

function submitTest() {
  const test = TESTS[state.currentIdx];
  let val;
  if (test.inputType === "level") {
    if (state.selectedLevel === null) return;
    val = state.selectedLevel;
  } else {
    const inp = document.getElementById("testInput");
    if (!inp) return;
    val = parseFloat(inp.value);
    if (isNaN(val)) return;
    if (!test.allowNegative && val < 0) return;
  }
  const si = calcScore(test, val, state.gender, state.ageGroup, state.useAlt);
  state.results[test.id] = { value: val, useAlt: state.useAlt, scoreIdx: si };
  if (state.currentIdx + 1 < TESTS.length) {
    state.currentIdx++; state.useAlt = false; state.showRef = false; state.selectedLevel = null;
    render();
    document.getElementById("testInput")?.focus();
  } else {
    state.phase = "result";
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

render();
</script>
</body>
</html>
