let state = { phase: "intro", gender: "m", ageGroup: "nuori", currentIdx: 0, results: {}, useAlt: false, showRef: false, selectedLevel: null, submitState: "idle", testDate: null, prev: null, saveMsg: "", draft: "", negSign: false };

// ─── KESKENERÄINEN TESTI (säilyy, jos puhelin lukittuu tai sivu latautuu uudelleen) ──
const PROGRESS_KEY = "budoakatemia-kuntotesti-kesken";
const PROGRESS_MAX_AGE = 12 * 3600 * 1000;
function saveProgress() {
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify({ t: Date.now(), gender: state.gender, ageGroup: state.ageGroup, currentIdx: state.currentIdx, results: state.results })); } catch (e) {}
}
function loadProgress() {
  try {
    const p = JSON.parse(localStorage.getItem(PROGRESS_KEY) || "null");
    if (p && Date.now() - p.t < PROGRESS_MAX_AGE && p.results && Object.keys(p.results).length) return p;
  } catch (e) {}
  return null;
}
function clearProgress() { try { localStorage.removeItem(PROGRESS_KEY); } catch (e) {} }

// Hyväksyy myös desimaalipilkun (12,5).
function parseInput(str) { return parseFloat(String(str).replace(",", ".").trim()); }

// ─── OMA HISTORIA (tallentuu vain tähän selaimeen) ───────────────────────────
const HISTORY_KEY = "budoakatemia-kuntotesti-historia";
const HISTORY_MAX = 20;
function loadHistory() {
  try { const h = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); return Array.isArray(h) ? h : []; }
  catch (e) { return []; }
}
function saveHistory(h) {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(-HISTORY_MAX))); return true; }
  catch (e) { return false; }
}
function fmtDate(iso) { try { return new Date(iso).toLocaleDateString("fi-FI"); } catch (e) { return ""; } }
function fmtNum(n) { return String(Math.round(n * 10) / 10).replace(".", ","); }

// Muutos edelliseen testiin. Kaikissa testeissä suurempi arvo on parempi.
function deltaFor(test) {
  const cur = state.results[test.id], prev = state.prev?.results?.[test.id];
  if (!cur || !prev || !!cur.useAlt !== !!prev.useAlt) return null;
  const d = Math.round((parseFloat(cur.value) - parseFloat(prev.value)) * 10) / 10;
  if (isNaN(d)) return null;
  const unit = test.inputType === "level" ? " taso" : " " + (displayUnit(test, cur.useAlt).split(" ")[0]);
  if (d === 0) return { d, cls: "delta-same", text: "± 0 edelliseen" };
  return { d, cls: d > 0 ? "delta-up" : "delta-down", text: (d > 0 ? "▲ +" : "▼ −") + fmtNum(Math.abs(d)) + unit };
}

function resultsAsText() {
  const gLabel = state.gender === "m" ? "Miehet" : "Naiset";
  const aLabel = {nuori:"16–29 v", keski:"30–44 v", masters:"45–65 v"}[state.ageGroup];
  const L = ["Budo Akatemia – karate-kuntotesti " + fmtDate(state.testDate), gName(gLabel, aLabel),
             "Kokonaisarvio: " + LEVEL_LABELS[overallIdx()], ""];
  TESTS.forEach(t => {
    const r = state.results[t.id]; if (!r) return;
    const unit = displayUnit(t, r.useAlt);
    const dl = deltaFor(t);
    L.push(t.name + ": " + displayValue(t, r.value, r.useAlt) + (unit ? " " + unit : "") + " – " + LEVEL_LABELS[r.scoreIdx] + (dl ? " (" + dl.text + ")" : ""));
  });
  const imp = improvedTests();
  if (state.prev) { L.push(""); L.push("Parantuneet edellisestä testistä (" + fmtDate(state.prev.date) + "): " + (imp.length ? imp.join(", ") : "ei parantuneita tuloksia")); }
  return L.join("\n");
}
function gName(g, a) { return g + " · " + a; }
function improvedTests() { return TESTS.filter(t => { const dl = deltaFor(t); return dl && dl.d > 0; }).map(t => t.name); }

// Suoritustavan valinta voi koskea vain toista sukupuolta (punnerrukset: naiset).
function optionsFor(test) {
  return test.inputOptions && (!test.altFor || test.altFor === state.gender) ? test.inputOptions : null;
}
function isExpert(test, useAlt) { return !!(test.expert || (useAlt && test.altExpert)); }
function sourceFor(test, useAlt) { return useAlt && test.altSource ? test.altSource : test.source; }

function calcScore(test, rawVal, gender, age, useAlt) {
  const t = useAlt ? (test.altScores?.[gender]?.[age]) : test.scores[gender][age];
  if (!t) return 4;
  const val = parseFloat(rawVal);
  if (isNaN(val)) return null;
  if (!test.allowNegative && val < 0) return null;
  if (val >= t[0]) return 0;
  if (val >= t[1]) return 1;
  if (val >= t[2]) return 2;
  if (val >= t[3]) return 3;
  return 4;
}

function thresholdRows(test, gender, age, useAlt) {
  const t = useAlt ? (test.altScores?.[gender]?.[age]) : test.scores[gender][age];
  if (!t) return [];
  const formatVal = (v, prefix) => {
    if (test.inputType === "level") {
      const lev = BODY_LEVELS.find(l => l.v === v);
      return prefix + (lev ? lev.short : v);
    }
    const opts = optionsFor(test);
    const unit = opts ? opts[useAlt ? 1 : 0] : test.unit;
    return `${prefix}${v} ${unit}`;
  };
  return [
    { label:"Erinomainen", val: formatVal(t[0], "≥ ") },
    { label:"Hyvä",        val: formatVal(t[1], "≥ ") },
    { label:"Tyydyttävä",  val: formatVal(t[2], "≥ ") },
    { label:"Välttävä",    val: formatVal(t[3], "≥ ") },
    { label:"Kehitettävä", val: formatVal(t[3], "< ") },
  ];
}

function catSummary() {
  return CATEGORIES.map(cat => {
    const vals = TESTS.filter(t => t.category === cat.id).map(t => state.results[t.id]?.scoreIdx).filter(v => v != null);
    const avg = vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : null;
    return { ...cat, avg };
  });
}

function overallIdx() {
  const vals = Object.values(state.results).map(r => r.scoreIdx).filter(v => v != null);
  return vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : 2;
}

function segBtn(val, label, active, group) {
  return `<button type="button" class="${active?'active':''}" aria-pressed="${active}" data-group="${group}" data-val="${val}">${label}</button>`;
}

function displayValue(test, val, useAlt) {
  if (test.inputType === "level") {
    const lev = BODY_LEVELS.find(l => l.v === parseInt(val));
    return lev ? lev.short : val;
  }
  return val;
}

function displayUnit(test, useAlt) {
  if (test.inputType === "level") return "";
  const opts = optionsFor(test);
  return opts ? opts[useAlt ? 1 : 0] : test.unit;
}

// ─── DATA SUBMISSION ─────────────────────────────────────────────────────────
function submitResults() {
  if (!SUBMIT_URL) return Promise.resolve({ ok:false, skip:true });
  const payload = {
    timestamp: new Date().toISOString(),
    gender: state.gender,
    ageGroup: state.ageGroup,
    results: {},
  };
  TESTS.forEach(t => {
    const r = state.results[t.id];
    if (r) {
      payload.results[t.id] = {
        value: r.value,
        useAlt: r.useAlt || false,
        scoreIdx: r.scoreIdx,
      };
    }
  });
  return fetch(SUBMIT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload),
  }).then(() => ({ ok: true })).catch(err => ({ ok: false, error: err.message }));
}

function refRowsHtml(test) {
  const useAlt = test.inputType === "level" ? false : state.useAlt;
  const src = sourceFor(test, useAlt);
  const note = src ? `<div class="ref-source${isExpert(test, useAlt) ? " expert" : ""}">${isExpert(test, useAlt) ? "⚠ " : "📚 "}${src}</div>` : "";
  return thresholdRows(test, state.gender, state.ageGroup, state.useAlt).map((r,i) =>
    `<div class="threshold-row" style="background:${LEVEL_BG[i]};border:1px solid ${LEVEL_BORDER[i]}">
      <span class="threshold-lbl" style="color:${LEVEL_COLORS[i]}">${r.label}</span>
      <span class="threshold-val">${r.val}</span>
    </div>`).join("") + note;
}

function badgeHtml(pi) {
  return pi === null ? "" : `<div class="level-badge" style="background:${LEVEL_BG[pi]};border:2px solid ${LEVEL_BORDER[pi]};color:${LEVEL_COLORS[pi]}">${LEVEL_LABELS[pi]}</div>`;
}

// Nykyisen testin syötetty arvo, tai null jos syöte ei kelpaa.
function currentValue(test) {
  if (test.inputType === "level") return state.selectedLevel;
  const v = parseInput(state.draft);
  if (isNaN(v)) return null;
  const val = test.allowNegative && state.negSign ? -Math.abs(v) : v;
  if (!test.allowNegative && val < 0) return null;
  return val;
}
function currentScore(test) {
  const v = currentValue(test);
  return v === null ? null : calcScore(test, v, state.gender, state.ageGroup, test.inputType === "level" ? false : state.useAlt);
}

function renderTest() {
  const test = TESTS[state.currentIdx];
  const cat  = CATEGORIES.find(c => c.id === test.category);
  const cc   = CAT_COLORS[test.category];
  const total = TESTS.length;
  const pct = ((state.currentIdx + 1) / total * 100).toFixed(1);
  const opts = optionsFor(test);
  const hasAlt = !!(opts && test.altScores?.[state.gender]);
  const isLevel = test.inputType === "level";
  const unitLabel = isLevel ? "kehontaso" : (hasAlt ? opts[state.useAlt ? 1 : 0] : test.unit);
  const pi = currentScore(test);

  const altToggle = hasAlt ? `<div class="seg" style="margin-bottom:.9rem">
      ${segBtn("0", opts[0], !state.useAlt, "alt")}

  </div>`;
}

function renderResult() {
  const oi = overallIdx();
  const cs = catSummary();
  const gLabel = state.gender === "m" ? "Miehet" : "Naiset";

  let submitStatus = "";
  if (SUBMIT_URL) {
    if (state.submitState === "sending") submitStatus = `<div class="submit-status sending">Lähetetään tuloksia seuran tilastoihin…</div>`;
    else if (state.submitState === "success") submitStatus = `<div class="submit-status success">✓ Tulokset lisätty seuran anonyymeihin tilastoihin</div>`;
    else if (state.submitState === "error") submitStatus = `<div class="submit-status error">Tilastoihin lähetys epäonnistui (tulokset näkyvät silti sinulle)</div>`;
  }

  const catPills = cs.map(cat => {
    const i = cat.avg ?? 2;
    const cc = CAT_COLORS[cat.id];
    return `<div class="cat-pill" style="background:${cc.bg};border:1px solid ${cc.border}">

      </div>
    </div>`;
  }).join("");

  const resultRows = TESTS.map(t => {
    const res = state.results[t.id];
    if (!res) return "";
    const si = res.scoreIdx;
    const cc = CAT_COLORS[t.category];
    const cat = CATEGORIES.find(c => c.id === t.category);
    const valStr = displayValue(t, res.value, res.useAlt);
    const unitStr = displayUnit(t, res.useAlt);
    const dl = deltaFor(t);
    const deltaHtml = dl ? `<div class="result-delta ${dl.cls}">${dl.text}</div>` : "";
    const dots = [0,1,2,3,4].map(j => `<div class="dot" style="background:${j===si ? LEVEL_COLORS[si] : '#ddd'}"></div>`).join("");
    return `<div class="result-row">
      <span class="result-icon">${t.icon}</span>
      <div style="flex:1;min-width:0">
        <div class="result-name">${t.name}</div>
        <div class="result-cat" style="color:${cc.text}">${cat.label}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div class="result-value">${valStr}${unitStr ? `<span class="result-unit">${unitStr}</span>` : ""}</div>
        <div class="result-level" style="color:${LEVEL_COLORS[si]}">${LEVEL_LABELS[si]}${isExpert(t, res.useAlt) ? " *" : ""}</div>
        ${deltaHtml}
      </div>
      <div class="dot-col">${dots}</div>
    </div>`;
  }).join("");

  const imp = improvedTests();
  const compareBox = state.prev ? `
    <div class="compare-box">
      <strong>Vertailu edelliseen testiin (${fmtDate(state.prev.date)})</strong>
      ${imp.length ? "Parantuneet: " + imp.join(", ") + "." : "Yksikään tulos ei parantunut edellisestä testistä."}
    </div>` : "";

  const tips = cs.map(cat => {
    const i = cat.avg ?? 2;
    return `<div class="tip-row">
      <span style="font-size:1.1rem;flex-shrink:0">${cat.icon}</span>
      <span>${DEV_TIPS[cat.id][Math.min(i,4)]}</span>
    </div>`;
  }).join("");

  return `<div class="card" style="max-width:640px">
    <div class="eyebrow">Budo Akatemia ry · Shorin-ryu Seibukan</div>
    <h1>Kuntotestin tulokset</h1>
    <div style="text-align:center;margin-bottom:.5rem;font-size:.78rem;color:#888;font-weight:600">
      ${fmtDate(state.testDate)} · ${gLabel} · ${aLabel}
    </div>
    <div class="rule"></div>
    <div class="no-print">${submitStatus}</div>
    <div class="overall-box" style="background:${LEVEL_BG[oi]};border:2px solid ${LEVEL_BORDER[oi]}">
      <div class="overall-eyebrow">Kokonaisarvio</div>
      <div class="overall-label" style="color:${LEVEL_COLORS[oi]}">${LEVEL_LABELS[oi]}</div>
    </div>
    <div class="cat-grid">${catPills}</div>
    ${compareBox}
    <div class="results-header">Testikohtaiset tulokset</div>
    ${resultRows}
    <div class="ref-footnote">* Asiantuntija-arvio: testille ei ole tutkittua väestönormia, joten taso on suuntaa antava. Muut tasot perustuvat julkaistuihin väestönormeihin.</div>
    <div class="tips-box">
      <div class="tips-header">Kehitysehdotukset</div>
      ${tips}
    </div>
    <div class="no-print">
      <div class="save-row">
        <button class="btn-save" id="shareBtn">↗ Jaa tulokset</button>
        <button class="btn-save" id="printBtn">⤓ Tallenna PDF</button>
      </div>
      <div class="save-status" id="saveStatus" role="status">${state.saveMsg}</div>
      <div class="history-note">
        Tulokset on tallennettu tähän selaimeen seuraavaa vertailua varten. Tallenna ne silti myös itsellesi:
        puhelin voi poistaa selaimeen tallennetut tiedot, jos sivulla ei käydä pitkään aikaan.
      </div>
      <button class="btn-primary" id="restartBtn">↺ Tee testi uudelleen</button>
    </div>
  </div>`;
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = state.phase === "intro" ? renderIntro() : state.phase === "test" ? renderTest() : renderResult();
}

function focusInput() {
  // Näppäimistö avataan automaattisesti vain tietokoneella; puhelimessa se peittäisi ohjeen.
  if (window.matchMedia && matchMedia("(pointer: fine)").matches) document.getElementById("testInput")?.focus();
}

function enterTest(idx) {
  const test = TESTS[idx], prev = state.results[test.id];
  state.currentIdx = idx; state.showRef = false;
  state.useAlt = prev ? !!prev.useAlt : false;
  state.selectedLevel = test.inputType === "level" && prev ? prev.value : null;
  state.negSign = !!(prev && prev.value < 0);
  state.draft = prev && test.inputType !== "level" ? String(Math.abs(prev.value)).replace(".", ",") : "";
  render();
  window.scrollTo(0, 0);
  focusInput();
}

// Päivittää arviotason ja Seuraava-painikkeen ilman koko näkymän uudelleenpiirtoa.
function updateLive() {
  const test = TESTS[state.currentIdx], pi = currentScore(test);
  const inp = document.getElementById("testInput");
  if (inp) inp.style.borderColor = pi !== null ? LEVEL_COLORS[pi] : "#d0c8be";
  const badge = document.getElementById("liveBadge"); if (badge) badge.innerHTML = badgeHtml(pi);
  const nb = document.getElementById("nextBtn"); if (nb) nb.disabled = pi === null;
}

function storeCurrent() {
  const test = TESTS[state.currentIdx], val = currentValue(test);
  if (val === null) return false;
  const useAlt = test.inputType === "level" ? false : state.useAlt;
  state.results[test.id] = { value: val, useAlt, scoreIdx: calcScore(test, val, state.gender, state.ageGroup, useAlt) };
  saveProgress();
  return true;
}

function submitTest() {
  if (!storeCurrent()) return;
  if (state.currentIdx + 1 < TESTS.length) { enterTest(state.currentIdx + 1); return; }

  clearProgress();
  state.phase = "result";
  state.testDate = new Date().toISOString();
  state.saveMsg = "";
  const hist = loadHistory();
  // Saman päivän uusintasuoritus korvaa päivän aiemman tuloksen, jotta vertailu tehdään edelliseen testikertaan.
  const last = hist[hist.length - 1];
  if (last && new Date(last.date).toDateString() === new Date(state.testDate).toDateString()) hist.pop();
  state.prev = hist.length ? hist[hist.length - 1] : null;
  hist.push({ date: state.testDate, gender: state.gender, ageGroup: state.ageGroup, results: state.results });
  saveHistory(hist);
  if (SUBMIT_URL) {
    state.submitState = "sending";
    submitResults().then(res => {
      state.submitState = res.ok ? "success" : (res.skip ? "idle" : "error");
      if (state.phase === "result") render();
    });
  }
  render();
  window.scrollTo(0, 0);
}

function shareResults() {
  const text = resultsAsText();
  const setMsg = m => { state.saveMsg = m; const el = document.getElementById("saveStatus"); if (el) el.textContent = m; };
  const copy = () => {
    const fail = () => setMsg("Jakaminen ei onnistunut. Käytä PDF-tallennusta.");
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(() => setMsg("Tulokset kopioitu. Liitä ne esimerkiksi muistiinpanoihin tai viestiin itsellesi."), fail);
    else fail();
  };
  if (navigator.share) navigator.share({ title: "Karate-kuntotestin tulokset", text }).catch(err => { if (!err || err.name !== "AbortError") copy(); });
  else copy();
}

// ─── TAPAHTUMAT: yksi kuuntelija koko sovellukselle ──────────────────────────
const app = document.getElementById("app");

app.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;

  if (t.dataset.group) {
    const g = t.dataset.group, v = t.dataset.val;
    if (g === "gender") { state.gender = v; state.useAlt = false; }
    if (g === "age")    state.ageGroup = v;
    if (g === "alt")    state.useAlt = v === "1";
    if (g === "sign")   state.negSign = v === "minus";
    render();
    if (state.phase === "test") focusInput();
    return;
  }
  if (t.dataset.level) {
    state.selectedLevel = parseInt(t.dataset.level, 10);
    app.querySelectorAll(".level-btn").forEach(x => { const on = x === t; x.classList.toggle("active", on); x.setAttribute("aria-pressed", on); });
    updateLive();
    return;
  }
  switch (t.id) {
    case "startBtn":
      clearProgress();
      state.phase = "test"; state.results = {}; state.submitState = "idle";
      enterTest(0); break;
    case "resumeBtn": {
      const p = loadProgress(); if (!p) { render(); break; }
      state.gender = p.gender; state.ageGroup = p.ageGroup; state.results = p.results;
      state.phase = "test"; state.submitState = "idle";
      const next = TESTS.findIndex(x => !state.results[x.id]);
      enterTest(next === -1 ? TESTS.length - 1 : next); break;
    }
    case "nextBtn": submitTest(); break;
    case "backBtn":
      storeCurrent();
      enterTest(state.currentIdx - 1); break;
    case "refToggle": {
      state.showRef = !state.showRef;
      t.textContent = (state.showRef ? "▴ Piilota" : "▾ Näytä") + " viitearvot";
      t.setAttribute("aria-expanded", state.showRef);
      document.getElementById("refRows").innerHTML = state.showRef ? refRowsHtml(TESTS[state.currentIdx]) : "";
      break;
    }
    case "restartBtn":
      state.phase = "intro"; state.results = {}; state.submitState = "idle"; state.saveMsg = "";
      render(); window.scrollTo(0, 0); break;
    case "clearHistBtn":
      if (!confirm("Poistetaanko tälle laitteelle tallennetut kuntotestitulokset?")) break;
      try { localStorage.removeItem(HISTORY_KEY); } catch (err) {}
      render(); break;
    case "printBtn": window.print(); break;
    case "shareBtn": shareResults(); break;
  }
});

app.addEventListener("input", e => {
  if (e.target.id !== "testInput") return;
  state.draft = e.target.value;
  updateLive();
});

app.addEventListener("keydown", e => {
  if (e.target.id === "testInput" && e.key === "Enter") { e.preventDefault(); submitTest(); }
});

(function prefill() {
  const h = loadHistory(); const last = h[h.length - 1];
  if (last) { if (last.gender) state.gender = last.gender; if (last.ageGroup) state.ageGroup = last.ageGroup; }
})();
render();
</script>
</body>
