<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karate-kuntotesti – Budo Akatemia ry</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #080808;
    color: #ddd8cc;
    font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }
  .card {
    width: 100%;
    max-width: 580px;
    background: #101010;
    border: 1px solid #242424;
    border-radius: 10px;
    padding: 2rem;
    box-shadow: 0 12px 48px rgba(0,0,0,.8);
  }
  .eyebrow {
    font-size: .62rem; letter-spacing: .35em; color: #444;
    text-transform: uppercase; text-align: center; margin-bottom: .3rem;
  }
  h1 {
    font-size: clamp(1.4rem, 5vw, 2rem); font-weight: normal;
    text-align: center; color: #f0ece4; margin-bottom: .15rem; letter-spacing: .04em;
  }
  .sub {
    font-size: .72rem; color: #444; text-align: center;
    letter-spacing: .18em; margin-bottom: 1.6rem;
  }
  .rule {
    width: 48px; height: 1px;
    background: linear-gradient(90deg, transparent, #b8903e, transparent);
    margin: 0 auto 1.6rem;
  }
  .lbl {
    font-size: .6rem; letter-spacing: .22em; color: #555;
    text-transform: uppercase; margin-bottom: .45rem; display: block;
  }
  .seg {
    display: flex; background: #181818; border: 1px solid #252525;
    border-radius: 6px; overflow: hidden; margin-bottom: 1.1rem;
  }
  .seg button {
    flex: 1; padding: .5rem .4rem; border: none; cursor: pointer;
    font-family: inherit; font-size: .82rem;
    background: transparent; color: #666; font-weight: normal;
    transition: all .18s;
  }
  .seg button.active {
    background: #b8903e; color: #0a0a0a; font-weight: bold;
  }
  .btn-primary {
    width: 100%; padding: .8rem; background: #b8903e;
    color: #0a0a0a; border: none; border-radius: 6px;
    font-size: 1rem; font-family: inherit; font-weight: bold;
    cursor: pointer; letter-spacing: .04em; margin-top: .5rem;
    transition: opacity .15s;
  }
  .btn-primary:disabled { opacity: .35; cursor: default; }
  .btn-ghost {
    background: transparent; color: #555; border: 1px solid #2a2a2a;
    border-radius: 5px; padding: .45rem .9rem;
    font-family: inherit; font-size: .75rem; cursor: pointer;
    width: 100%; margin-bottom: .7rem; transition: color .15s;
  }
  .btn-ghost:hover { color: #888; }
  .number-input {
    width: 100%; background: #181818; border: 1px solid #2e2e2e;
    border-radius: 6px; padding: .8rem 1rem;
    font-size: 1.6rem; color: #f0ece4; font-family: inherit;
    text-align: center; outline: none; margin-bottom: .5rem;
    transition: border-color .2s;
  }
  .number-input:focus { border-color: #b8903e; }
  .info-box {
    background: #141414; border: 1px solid #202020;
    border-radius: 6px; padding: .85rem 1rem; margin-bottom: .9rem;
    font-size: .8rem; color: #9a8e7e; line-height: 1.72;
  }
  .source-line {
    font-size: .62rem; color: #3a3a3a; margin-bottom: .9rem;
    padding-left: .8rem;
  }
  .progress-bar-wrap {
    margin-bottom: 1.3rem;
  }
  .progress-meta {
    display: flex; justify-content: space-between;
    font-size: .65rem; color: #444; margin-bottom: .38rem;
  }
  .progress-track {
    height: 3px; background: #1e1e1e; border-radius: 3px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 3px; transition: width .35s ease;
  }
  .test-header { text-align: center; margin-bottom: 1.1rem; }
  .test-icon { font-size: 2rem; margin-bottom: .25rem; }
  .test-name {
    font-size: 1.3rem; font-weight: normal; color: #f0ece4;
    margin-bottom: .15rem; letter-spacing: .03em;
  }
  .test-subtitle { font-size: .65rem; letter-spacing: .18em; text-transform: uppercase; }
  .level-badge {
    border-radius: 5px; padding: .5rem 1rem;
    margin-bottom: .7rem; text-align: center; font-weight: bold; font-size: .95rem;
  }
  .threshold-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: .32rem .7rem; border-radius: 4px; margin-bottom: .22rem;
  }
  .threshold-lbl { font-size: .73rem; }
  .threshold-val { font-size: .73rem; color: #777; font-family: monospace; }
  .threshold-source { font-size: .6rem; color: #3a3a3a; margin-top: .4rem; text-align: center; }

  /* Results */
  .overall-box {
    text-align: center; padding: 1.1rem;
    border-radius: 8px; margin-bottom: 1.3rem;
  }
  .overall-eyebrow {
    font-size: .6rem; letter-spacing: .25em; color: #555;
    text-transform: uppercase; margin-bottom: .25rem;
  }
  .overall-label { font-size: 1.9rem; font-weight: normal; letter-spacing: .04em; }
  .cat-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; margin-bottom: 1.3rem;
  }
  .cat-pill {
    border-radius: 6px; padding: .65rem .9rem;
    display: flex; align-items: center; gap: .6rem;
  }
  .cat-pill-icon { font-size: 1.3rem; }
  .cat-pill-name {
    font-size: .6rem; color: #555; letter-spacing: .12em; text-transform: uppercase;
  }
  .cat-pill-label { font-size: .85rem; font-weight: bold; }
  .results-header {
    font-size: .6rem; letter-spacing: .22em; color: #444;
    text-transform: uppercase; margin-bottom: .6rem;
  }
  .result-row {
    display: flex; align-items: center; gap: .75rem; padding: .6rem .8rem;
    border-radius: 5px; background: #141414; border: 1px solid #1c1c1c;
    margin-bottom: .35rem;
  }
  .result-icon { font-size: 1.1rem; flex-shrink: 0; }
  .result-name { font-size: .8rem; color: #c8c0b4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-cat { font-size: .6rem; letter-spacing: .1em; }
  .result-value { font-size: .95rem; color: #f0ece4; font-weight: bold; text-align: right; flex-shrink: 0; }
  .result-unit { font-size: .62rem; color: #555; margin-left: .25rem; }
  .result-level { font-size: .72rem; font-weight: bold; text-align: right; }
  .dot-col { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: #252525; }
  .tips-box {
    background: #0e0e0e; border: 1px solid #1e1e1e;
    border-radius: 6px; padding: 1rem; margin-bottom: 1.1rem;
  }
  .tips-header {
    font-size: .6rem; letter-spacing: .22em; color: #444;
    text-transform: uppercase; margin-bottom: .7rem;
  }
  .tip-row { display: flex; gap: .6rem; margin-bottom: .55rem; font-size: .78rem; color: #8a8070; line-height: 1.6; }
  .src-footer {
    font-size: .62rem; color: #303030; line-height: 1.6;
    margin-bottom: 1.1rem; text-align: center;
  }
  .intro-test-cat { margin-bottom: .8rem; }
  .intro-cat-label {
    display: flex; align-items: center; gap: .5rem;
    font-size: .65rem; letter-spacing: .18em; text-transform: uppercase;
    margin-bottom: .35rem;
  }
  .intro-test-item {
    display: flex; align-items: center; gap: .6rem; padding: .35rem .7rem;
    background: #141414; border-radius: 4px; margin-bottom: .2rem;
  }
  .intro-test-item-name { font-size: .8rem; color: #c8c0b4; }
  .intro-test-item-sub { font-size: .62rem; color: #555; }
  .intro-info {
    background: #141210; border: 1px solid #252015;
    border-radius: 6px; padding: .9rem 1rem; margin-bottom: 1.2rem;
    font-size: .78rem; color: #8a7e68; line-height: 1.7;
  }
  .intro-info strong { color: #b8903e; display: block; margin-bottom: .3rem; }
  #app { width: 100%; display: flex; flex-direction: column; align-items: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
const LEVEL_COLORS = ["#27ae60","#6fba3a","#d4a017","#e07b20","#c0392b"];
const LEVEL_BG     = ["#0b1f13","#142210","#1e1a08","#1f1008","#1e0808"];
const LEVEL_LABELS = ["Erinomainen","Hyvä","Tyydyttävä","Välttävä","Kehitettävä"];

const CATEGORIES = [
  { id:"voima",        label:"Voima & kestävyys", color:"#c0392b", icon:"💪" },
  { id:"keskivartalo", label:"Keskivartalo",        color:"#1a6fa8", icon:"🛡️" },
  { id:"jalkavoima",   label:"Jalkavoima",          color:"#8e44ad", icon:"🦵" },
  { id:"rajahtavyys",  label:"Räjähtävyys",         color:"#d4a017", icon:"⚡" },
];

const TESTS = [
  {
    id:"punnerrukset", category:"voima", name:"Punnerrukset",
    subtitle:"Ylävartalon voima (PVKunto)", icon:"🥊",
    desc:"Mahdollisimman monta yhtäjaksoista toistoa ilman taukoa. Täysi liikerata: rinta lähelle lattiaa, käsivarret täysin suoraksi. Naiset: sama liike tai polvilta.",
    unit:"kpl", source:"Puolustusvoimat PVKunto / Cooper-normi",
    scores:{ m:{ nuori:[45,35,25,15], keski:[38,28,20,12], masters:[28,20,13,7] },
             n:{ nuori:[30,22,14,8],  keski:[24,17,11,6],  masters:[17,11,7,3] } },
  },
  {
    id:"riipunta", category:"voima", name:"Riipunta / leuat",
    subtitle:"Ylävartalon kestävyysvoima (NSCA)", icon:"🏋️",
    desc:"Roiku tangosta myötäote, kädet hartianlevyisessä asennossa. Laske aika, jonka pysyt roikkumaan. Vaihtoehto: leuanvedot täydellä liikeradalla.",
    unit:"sek", source:"NSCA / U.S. Army ACFT",
    inputOptions:["sek (roiku)","kpl (leuat)"],
    scores:{ m:{ nuori:[60,40,20,10], keski:[50,32,16,8], masters:[35,22,10,5] },
             n:{ nuori:[40,25,12,5],  keski:[30,18,8,3],  masters:[20,12,5,2] } },
    altScores:{ m:{ nuori:[12,8,4,2], keski:[9,6,3,1], masters:[6,4,2,1] },
                n:{ nuori:[5,3,1,0],  keski:[4,2,1,0], masters:[2,1,0,0] } },
  },
  {
    id:"vatsalihakset", category:"keskivartalo", name:"Vatsalihakset 60 sek",
    subtitle:"Vatsalihasten kestävyysvoima (PVKunto)", icon:"🫀",
    desc:"Makaa selällään, polvet koukussa (n. 90°), kädet ristissä rinnalla tai korvien vieressä. Nouse istumaan niin, että kyynärpäät koskettavat polvia. Laske toistot 60 sekunnissa.",
    unit:"kpl / 60 sek", source:"Puolustusvoimat PVKunto",
    scores:{ m:{ nuori:[50,42,33,24], keski:[45,37,28,20], masters:[38,30,22,14] },
             n:{ nuori:[44,36,27,18], keski:[39,31,23,15], masters:[32,24,17,10] } },
  },
  {
    id:"lankku", category:"keskivartalo", name:"Lankku (plank)",
    subtitle:"Isometrinen keskivartalon stabiliteetti (FMS / NSCA)", icon:"🛡️",
    desc:"Kyynärpäät lattiassa, vartalo suorassa linjasta kantapäistä niskaan. Pidä asento mahdollisimman kauan. Lantion vajoaminen tai kohoaminen lopettaa testin.",
    unit:"sek", source:"FMS / NSCA Functional Movement Screen",
    scores:{ m:{ nuori:[120,90,60,30], keski:[100,75,50,25], masters:[75,55,35,15] },
             n:{ nuori:[100,75,55,25], keski:[85,62,42,20],  masters:[65,45,28,12] } },
  },
  {
    id:"shikodachi", category:"jalkavoima", name:"Shiko-dachi -pito",
    subtitle:"Jalkalihasten staattinen voima (karatetutkimus)", icon:"🏯",
    desc:"Asetu shiko-dachi -asentoon: jalat n. 2× hartioiden leveys, varpaat 45° ulospäin, polvet suoraan varpaiden suuntaan, reidet vaakatasossa tai alle. Kädet vyötäisillä tai ristissä rinnalla. Pidä asento niin kauan kuin mahdollista. Aika pysähtyy kun reidet nousevat selvästi vaakatason yläpuolelle tai asento pettää.",
    unit:"sek", source:"Karatetutkimus (Mori ym.) / isometrinen jalkatesti / sotilaskuntoilu",
    scores:{ m:{ nuori:[120,90,60,30], keski:[100,72,48,24], masters:[75,55,35,15] },
             n:{ nuori:[100,75,50,25], keski:[82,60,40,20],  masters:[60,44,28,12] } },
  },
  {
    id:"seisomahyppy", category:"rajahtavyys", name:"Vauhditon pituus",
    subtitle:"Alaraajojen räjähtävä voima (Eurofit / NSCA)", icon:"🦘",
    desc:"Jalat hartianlevyisessä asennossa. Kyykisty vapaasti, heilauta kädet ja hyppää mahdollisimman kauas eteenpäin. Mittaa kantapäästä lähimpään jälkeen. 2 yritystä, paras tulos.",
    unit:"cm", source:"Eurofit / NSCA / Urheilututkimus",
    scores:{ m:{ nuori:[220,195,165,135], keski:[200,175,148,118], masters:[170,148,120,92] },
             n:{ nuori:[175,155,130,105], keski:[158,138,115,90],  masters:[133,113,90,68] } },
  },
  {
    id:"hyppykyykky", category:"rajahtavyys", name:"Hyppykyykyt 30 sek",
    subtitle:"Räjähtävä kestävyys (sotilastestit / NATO STANAG)", icon:"🔥",
    desc:"Laske mahdollisimman monta hyppykyykkyä 30 sekunnissa. Täysi kyykky (reidet vaakatasoon tai alle), täysi ojennus ylös hypyllä. Käytä sekuntikelloa.",
    unit:"kpl / 30 sek", source:"Puolustusvoimat / NATO STANAG 6234",
    scores:{ m:{ nuori:[24,18,13,8], keski:[20,15,10,6], masters:[15,11,7,4] },
             n:{ nuori:[20,15,10,6], keski:[17,12,8,4],  masters:[12,8,5,2] } },
  },
];

const DEV_TIPS = {
  voima:[
    "Loistava ylävartalon voimataso — ylläpidä monipuolisella voimaharjoittelulla.",
    "Hyvä pohja — lisää progressiivista ylikuormitusta punnerruksissa ja leuoissa.",
    "Kehitä ylävartalovoimaa: leuanveto, dipit, käsipainoharjoittelu 2–3×/vko.",
    "Priorisoi ylävartalon perusvoimaharjoittelu — aloita polvilta punnerruksista.",
    "Aloita perusvoimaharjoittelusta: polvilta punnerrukset, riippuminen tangosta.",
  ],
  keskivartalo:[
    "Erinomainen stabiliteetti — lisää dynaamisia keskivartaloliikkeitä.",
    "Hyvä taso — lisää haastetta: kohotettu lankku, sivulankku, rullaus.",
    "Kehitä: päivittäinen 3×30s lankku + vatsalihakset 3 sarjaa.",
    "Aloita: 3×15s lankku + 3×10 vatsarutistusta päivittäin.",
    "Keskity peruslankku-asennon hallintaan ennen toistoja.",
  ],
  jalkavoima:[
    "Erinomainen staattinen jalkavoima — lisää haastetta pidemmällä pidolla tai korotuksella.",
    "Hyvä taso — tavoittele säännöllisillä shiko-harjoituksilla 90+ sekuntia.",
    "Kehitä: päivittäinen shiko-dachi -pito 3 × max-aika, lisää aikaa asteittain.",
    "Aloita matalammalla asennolla (reidet ei täysin vaakatasossa) ja pidennä kestoa.",
    "Harjoittele asennon hallintaa ensin ilman aikapaineita — laatu ennen kestoa.",
  ],
  rajahtavyys:[
    "Huipputaso — lisää plyometriikkaa: depth jump, reaktiohypyt.",
    "Hyvä — lisää hyppykyykkyjen sarjoja ja seisomahyppyharjoituksia 2×/vko.",
    "Kehitä räjähtävyyttä: hyppykyykyt, askelkyykky-hypyt, box step-up.",
    "Aloita matalasta: kyykyt + jalkakyykyt, lisää hyppy vähitellen.",
    "Perusvoimaa ensin — räjähtävyys kehittyy kun peruspohja on kunnossa.",
  ],
};

// ─── STATE ───────────────────────────────────────────────────────────────────
let state = {
  phase: "intro",       // intro | test | result
  gender: "m",
  ageGroup: "nuori",
  currentIdx: 0,
  results: {},          // { testId: { value, useAlt, scoreIdx } }
  useAlt: false,
  showRef: false,
};

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function calcScore(test, rawVal, gender, age, useAlt) {
  const t = useAlt ? (test.altScores?.[gender]?.[age]) : test.scores[gender][age];
  if (!t) return 4;
  const val = parseFloat(rawVal);
  if (isNaN(val) || val < 0) return null;
  // riipunta alt (leuat) not lowerIsBetter; all tests: higher is better except none currently
  if (val >= t[0]) return 0;
  if (val >= t[1]) return 1;
  if (val >= t[2]) return 2;
  if (val >= t[3]) return 3;
  return 4;
}

function thresholdRows(test, gender, age, useAlt) {
  const t = useAlt ? (test.altScores?.[gender]?.[age]) : test.scores[gender][age];
  const unit = test.inputOptions ? test.inputOptions[useAlt ? 1 : 0] : test.unit;
  if (!t) return [];
  return [
    { label:"Erinomainen", val:`≥ ${t[0]} ${unit}` },
    { label:"Hyvä",        val:`≥ ${t[1]} ${unit}` },
    { label:"Tyydyttävä",  val:`≥ ${t[2]} ${unit}` },
    { label:"Välttävä",    val:`≥ ${t[3]} ${unit}` },
    { label:"Kehitettävä", val:`< ${t[3]} ${unit}` },
  ];
}

function catSummary() {
  return CATEGORIES.map(cat => {
    const vals = TESTS
      .filter(t => t.category === cat.id)
      .map(t => state.results[t.id]?.scoreIdx)
      .filter(v => v != null);
    const avg = vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : null;
    return { ...cat, avg };
  });
}

function overallIdx() {
  const vals = Object.values(state.results).map(r => r.scoreIdx).filter(v => v != null);
  return vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : 2;
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  if (state.phase === "intro")  app.innerHTML = renderIntro();
  if (state.phase === "test")   app.innerHTML = renderTest();
  if (state.phase === "result") app.innerHTML = renderResult();
  bindEvents();
}

// ── INTRO ────────────────────────────────────────────────────────────────────
function renderIntro() {
  const genderBtns = [
    btn("m","Miehet",state.gender==="m","gender"),
    btn("n","Naiset",state.gender==="n","gender"),
  ].join("");
  const ageBtns = [
    btn("nuori","16–29 v",state.ageGroup==="nuori","age"),
    btn("keski","30–44 v",state.ageGroup==="keski","age"),
    btn("masters","45–60 v",state.ageGroup==="masters","age"),
  ].join("");

  const testList = CATEGORIES.map(cat => {
    const items = TESTS.filter(t => t.category === cat.id).map(t =>
      `<div class="intro-test-item">
        <span style="font-size:1rem">${t.icon}</span>
        <div>
          <div class="intro-test-item-name">${t.name}</div>
          <div class="intro-test-item-sub">${t.subtitle}</div>
        </div>
      </div>`
    ).join("");
    return `<div class="intro-test-cat">
      <div class="intro-cat-label" style="color:${cat.color}">${cat.icon} ${cat.label}</div>
      ${items}
    </div>`;
  }).join("");

  return `<div class="card">
    <div class="eyebrow">Budo Akatemia ry · Shorin-ryu Seibukan</div>
    <h1>Karate-kuntotesti</h1>
    <div class="sub">VOIMA · KESKIVARTALO · JALKAVOIMA · RÄJÄHTÄVYYS</div>
    <div class="rule"></div>
    <span class="lbl">Sukupuoli</span>
    <div class="seg">${genderBtns}</div>
    <span class="lbl">Ikäryhmä</span>
    <div class="seg">${ageBtns}</div>
    <div style="margin-bottom:1.3rem">${testList}</div>
    <div class="intro-info">
      <strong>7 testiä · n. 25–30 min</strong>
      Tarvitset: sekuntikello, mittanauha.<br>
      Tee 10 min alkulämmittely. Suorita testit järjestyksessä.
      Merkitse tulos heti suorituksen jälkeen.
    </div>
    <button class="btn-primary" id="startBtn">Aloita testi →</button>
  </div>`;
}

function btn(val, label, active, group) {
  return `<button class="${active?'active':''}" data-group="${group}" data-val="${val}">${label}</button>`;
}

// ── TEST ─────────────────────────────────────────────────────────────────────
function renderTest() {
  const test = TESTS[state.currentIdx];
  const cat  = CATEGORIES.find(c => c.id === test.category);
  const total = TESTS.length;
  const pct = ((state.currentIdx + 1) / total * 100).toFixed(1);
  const hasAlt = !!(test.inputOptions && test.altScores);
  const unitLabel = hasAlt ? test.inputOptions[state.useAlt ? 1 : 0] : test.unit;

  const inputEl = document.getElementById("testInput");
  const currentVal = inputEl ? inputEl.value : "";
  const previewIdx = currentVal !== "" ? calcScore(test, currentVal, state.gender, state.ageGroup, state.useAlt) : null;

  const altToggle = hasAlt ? `
    <div class="seg" style="margin-bottom:.9rem">
      ${test.inputOptions.map((opt,i) =>
        `<button class="${state.useAlt===!!i?'active':''}" data-group="alt" data-val="${i}" style="--accent:${cat.color}">${opt}</button>`
      ).join("")}
    </div>` : "";

  const preview = previewIdx !== null ? `
    <div class="level-badge" style="background:${LEVEL_BG[previewIdx]};border:1px solid ${LEVEL_COLORS[previewIdx]}55;color:${LEVEL_COLORS[previewIdx]}">
      ${LEVEL_LABELS[previewIdx]}
    </div>` : `<div style="height:2.4rem;margin-bottom:.7rem"></div>`;

  const refRows = state.showRef ? thresholdRows(test, state.gender, state.ageGroup, state.useAlt).map((r,i) =>
    `<div class="threshold-row" style="background:${LEVEL_BG[i]}">
      <span class="threshold-lbl" style="color:${LEVEL_COLORS[i]}">${r.label}</span>
      <span class="threshold-val">${r.val}</span>
    </div>`
  ).join("") + `<div class="threshold-source">Lähde: ${test.source}</div>` : "";

  return `<div class="card">
    <div class="progress-bar-wrap">
      <div class="progress-meta">
        <span>Testi ${state.currentIdx+1} / ${total}</span>
        <span style="color:${cat.color}">${cat.icon} ${cat.label}</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width:${pct}%;background:${cat.color}"></div>
      </div>
    </div>
    <div class="test-header">
      <div class="test-icon">${test.icon}</div>
      <div class="test-name">${test.name}</div>
      <div class="test-subtitle" style="color:${cat.color}">${test.subtitle}</div>
    </div>
    <div class="info-box">${test.desc}</div>
    <div class="source-line" style="border-left:2px solid ${cat.color}33">📋 ${test.source}</div>
    ${altToggle}
    <span class="lbl">Tulos — ${unitLabel}</span>
    <input id="testInput" class="number-input" type="number" inputmode="decimal" min="0" placeholder="0" value="">
    ${preview}
    <button class="btn-ghost" id="refToggle">${state.showRef ? "▴ Piilota" : "▾ Näytä"} viitearvot</button>
    <div id="refRows">${refRows}</div>
    <button class="btn-primary" id="nextBtn">
      ${state.currentIdx + 1 < total ? "Seuraava →" : "Näytä tulokset →"}
    </button>
  </div>`;
}

// ── RESULT ───────────────────────────────────────────────────────────────────
function renderResult() {
  const oi = overallIdx();
  const cs = catSummary();
  const gLabel = state.gender === "m" ? "Miehet" : "Naiset";
  const aLabel = state.ageGroup === "nuori" ? "16–29 v" : state.ageGroup === "keski" ? "30–44 v" : "45–60 v";

  const catPills = cs.map(cat => {
    const i = cat.avg ?? 2;
    return `<div class="cat-pill" style="background:${LEVEL_BG[i]};border:1px solid ${LEVEL_COLORS[i]}44">
      <span class="cat-pill-icon">${cat.icon}</span>
      <div>
        <div class="cat-pill-name">${cat.label}</div>
        <div class="cat-pill-label" style="color:${LEVEL_COLORS[i]}">${cat.avg !== null ? LEVEL_LABELS[i] : "—"}</div>
      </div>
    </div>`;
  }).join("");

  const resultRows = TESTS.map(t => {
    const res = state.results[t.id];
    if (!res) return "";
    const si = res.scoreIdx;
    const tcat = CATEGORIES.find(c => c.id === t.category);
    const unitStr = t.inputOptions ? t.inputOptions[res.useAlt ? 1 : 0] : t.unit;
    const dots = [0,1,2,3,4].map(j =>
      `<div class="dot" style="background:${j===si?LEVEL_COLORS[si]:'#252525'}"></div>`
    ).join("");
    return `<div class="result-row">
      <span class="result-icon">${t.icon}</span>
      <div style="flex:1;min-width:0">
        <div class="result-name">${t.name}</div>
        <div class="result-cat" style="color:${tcat.color}">${tcat.label}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div class="result-value">${res.value}<span class="result-unit">${unitStr}</span></div>
        <div class="result-level" style="color:${LEVEL_COLORS[si]}">${LEVEL_LABELS[si]}</div>
      </div>
      <div class="dot-col">${dots}</div>
    </div>`;
  }).join("");

  const tips = cs.map(cat => {
    const i = cat.avg ?? 2;
    return `<div class="tip-row">
      <span style="color:${cat.color};flex-shrink:0">${cat.icon}</span>
      <span>${DEV_TIPS[cat.id][Math.min(i,4)]}</span>
    </div>`;
  }).join("");

  return `<div class="card" style="max-width:640px">
    <div class="eyebrow">Budo Akatemia ry · Shorin-ryu Seibukan</div>
    <h1>Kuntotestin tulokset</h1>
    <div style="text-align:center;margin-bottom:.4rem;font-size:.7rem;color:#444;letter-spacing:.14em">
      ${gLabel} · ${aLabel}
    </div>
    <div class="rule"></div>
    <div class="overall-box" style="background:${LEVEL_BG[oi]};border:1px solid ${LEVEL_COLORS[oi]}55">
      <div class="overall-eyebrow">Kokonaisarvio</div>
      <div class="overall-label" style="color:${LEVEL_COLORS[oi]}">${LEVEL_LABELS[oi]}</div>
    </div>
    <div class="cat-grid">${catPills}</div>
    <div class="results-header">Testikohtaiset tulokset</div>
    ${resultRows}
    <div style="margin-bottom:1.3rem"></div>
    <div class="tips-box">
      <div class="tips-header">Kehitysehdotukset</div>
      ${tips}
    </div>
    <div class="src-footer">
      Viitearvot: Puolustusvoimat PVKunto · NSCA · Eurofit · NATO STANAG 6234 · Karatetutkimus (isometrinen jalkatesti)
    </div>
    <button class="btn-primary" id="restartBtn">↺ Tee testi uudelleen</button>
  </div>`;
}

// ─── EVENT BINDING ────────────────────────────────────────────────────────────
function bindEvents() {
  // Segment buttons (intro)
  document.querySelectorAll(".seg button[data-group]").forEach(b => {
    b.addEventListener("click", () => {
      const g = b.dataset.group, v = b.dataset.val;
      if (g === "gender") state.gender = v;
      if (g === "age")    state.ageGroup = v;
      if (g === "alt")    { state.useAlt = !!parseInt(v); }
      render();
      // restore focus to input after re-render if in test
      if (state.phase === "test") {
        const inp = document.getElementById("testInput");
        if (inp) inp.focus();
      }
    });
  });

  document.getElementById("startBtn")?.addEventListener("click", () => {
    state.phase = "test"; state.currentIdx = 0; state.results = {};
    state.useAlt = false; state.showRef = false;
    render();
    document.getElementById("testInput")?.focus();
  });

  document.getElementById("restartBtn")?.addEventListener("click", () => {
    state.phase = "intro"; state.results = {};
    render();
  });

  document.getElementById("refToggle")?.addEventListener("click", () => {
    state.showRef = !state.showRef;
    // re-render only the ref section + button label
    const test = TESTS[state.currentIdx];
    const btn = document.getElementById("refToggle");
    const div = document.getElementById("refRows");
    if (btn) btn.textContent = (state.showRef ? "▴ Piilota" : "▾ Näytä") + " viitearvot";
    if (div) div.innerHTML = state.showRef
      ? thresholdRows(test, state.gender, state.ageGroup, state.useAlt).map((r,i) =>
          `<div class="threshold-row" style="background:${LEVEL_BG[i]}">
            <span class="threshold-lbl" style="color:${LEVEL_COLORS[i]}">${r.label}</span>
            <span class="threshold-val">${r.val}</span>
          </div>`
        ).join("") + `<div class="threshold-source">Lähde: ${test.source}</div>`
      : "";
  });

  const inp = document.getElementById("testInput");
  if (inp) {
    inp.addEventListener("input", () => {
      const test = TESTS[state.currentIdx];
      const val = parseFloat(inp.value);
      const pi = (!isNaN(val) && val >= 0) ? calcScore(test, val, state.gender, state.ageGroup, state.useAlt) : null;
      // update border
      inp.style.borderColor = pi !== null ? LEVEL_COLORS[pi] + "99" : "#2e2e2e";
      // update badge
      const badge = inp.nextElementSibling;
      if (badge && badge.classList.contains("level-badge")) {
        if (pi !== null) {
          badge.style.display = "";
          badge.style.background = LEVEL_BG[pi];
          badge.style.border = `1px solid ${LEVEL_COLORS[pi]}55`;
          badge.style.color = LEVEL_COLORS[pi];
          badge.textContent = LEVEL_LABELS[pi];
        } else {
          badge.style.display = "none";
        }
      }
      // enable/disable next button
      const nb = document.getElementById("nextBtn");
      if (nb) nb.disabled = isNaN(val) || val < 0 || inp.value === "";
    });
    inp.addEventListener("keydown", e => { if (e.key === "Enter") submitTest(); });
    // init button state
    const nb = document.getElementById("nextBtn");
    if (nb) nb.disabled = true;
  }

  document.getElementById("nextBtn")?.addEventListener("click", submitTest);
}

function submitTest() {
  const inp = document.getElementById("testInput");
  if (!inp) return;
  const val = parseFloat(inp.value);
  if (isNaN(val) || val < 0) return;
  const test = TESTS[state.currentIdx];
  const si = calcScore(test, val, state.gender, state.ageGroup, state.useAlt);
  state.results[test.id] = { value: val, useAlt: state.useAlt, scoreIdx: si };
  if (state.currentIdx + 1 < TESTS.length) {
    state.currentIdx++; state.useAlt = false; state.showRef = false;
    render();
    document.getElementById("testInput")?.focus();
  } else {
    state.phase = "result";
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
