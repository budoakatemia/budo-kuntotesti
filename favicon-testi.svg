<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bgWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8b860"/>
      <stop offset="100%" stop-color="#dc7840"/>
    </linearGradient>
  </defs>

  <rect width="180" height="180" rx="40" fill="url(#bgWarm)"/>
  <rect x="11" y="11" width="158" height="158" rx="34" fill="none" stroke="rgba(255,255,255,0.20)" stroke-width="2"/>

  <!-- 武道 (Budō) - the martial way -->
  <text x="90" y="82"
        font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', sans-serif"
        font-size="72"
        font-weight="700"
        fill="white"
        text-anchor="middle">武</text>
  <text x="90" y="155"
        font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', sans-serif"
        font-size="72"
        font-weight="700"
        fill="white"
        text-anchor="middle">道</text>
</svg>
