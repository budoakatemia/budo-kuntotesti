<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bgGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dca84e"/>
      <stop offset="100%" stop-color="#b48026"/>
    </linearGradient>
  </defs>

  <rect width="180" height="180" rx="40" fill="url(#bgGold)"/>
  <rect x="11" y="11" width="158" height="158" rx="34" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>

  <!-- Karate fist (seiken) -->
  <g fill="white">
    <!-- Knuckles -->
    <rect x="50" y="60" width="18" height="18" rx="8"/>
    <rect x="70" y="60" width="18" height="18" rx="8"/>
    <rect x="90" y="60" width="18" height="18" rx="8"/>
    <rect x="110" y="60" width="18" height="18" rx="8"/>

    <!-- Fist back / palm -->
    <rect x="42" y="74" width="95" height="62" rx="18"/>

    <!-- Thumb -->
    <path d="M 42 113 Q 33 107 32 90 Q 33 76 48 80 L 54 95 Z"/>

    <!-- Wrist/forearm -->
    <rect x="58" y="133" width="62" height="22" rx="4"/>

    <!-- Belt strip -->
    <rect x="50" y="147" width="78" height="8" fill="#1e1e1e"/>
  </g>

  <!-- Knuckle separator shadows -->
  <g stroke="rgba(180,128,38,0.6)" stroke-width="2" stroke-linecap="round">
    <line x1="65" y1="80" x2="65" y2="92"/>
    <line x1="89" y1="80" x2="89" y2="92"/>
    <line x1="113" y1="80" x2="113" y2="92"/>
  </g>

  <!-- Crease shadow on back of fist -->
  <line x1="55" y1="108" x2="125" y2="108" stroke="rgba(200,148,58,0.4)" stroke-width="2"/>
</svg>
