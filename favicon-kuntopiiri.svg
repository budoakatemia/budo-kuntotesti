<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bgOcean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2882a0"/>
      <stop offset="100%" stop-color="#0e4a63"/>
    </linearGradient>
  </defs>

  <rect width="180" height="180" rx="40" fill="url(#bgOcean)"/>
  <rect x="11" y="11" width="158" height="158" rx="34" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>

  <!-- 道 (Dō) kanji - the path/way -->
  <text x="90" y="138"
        font-family="'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', sans-serif"
        font-size="135"
        font-weight="700"
        fill="white"
        text-anchor="middle"
        style="dominant-baseline: alphabetic;">道</text>
</svg>
